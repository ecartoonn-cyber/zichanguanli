name: Build and deploy to EdgeOne

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment configuration
        id: config
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Set NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY under repository Variables before deploying."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$EDGEONE_API_TOKEN" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Set EDGEONE_API_TOKEN under repository Actions secrets before deploying."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up pnpm
        if: steps.config.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        if: steps.config.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.config.outputs.ready == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_SIGNUP_ENABLED: ${{ vars.NEXT_PUBLIC_SUPABASE_SIGNUP_ENABLED || 'false' }}
        run: pnpm build

      - name: Deploy to the existing EdgeOne project
        if: steps.config.outputs.ready == 'true' && steps.config.outputs.has_token == 'true'
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: npx --yes edgeone makers deploy ./dist -n personal-invest-os -t "$EDGEONE_API_TOKEN" -e production

      - name: Explain skipped deployment
        if: steps.config.outputs.ready != 'true' || steps.config.outputs.has_token != 'true'
        run: echo "Build/deploy skipped until the required GitHub repository variables and secret are configured."
